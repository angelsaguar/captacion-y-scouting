name: Fase B security checks

on:
  push:
    branches:
      - feat/fase-b-hardening-supabase
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Security unit tests
        run: npm run test:security
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
